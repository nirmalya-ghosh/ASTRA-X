version: "3.9"

services:
  # ── Frontend (Next.js) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped

  # ── Backend (FastAPI) ───────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ASTRAX_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db.xxxxxxxxxxxx.supabase.co:5432/postgres
      - ASTRAX_DATA_DIR=/app/data
      - ASTRAX_UPLOAD_DIR=/app/data/uploads
      - ASTRAX_CACHE_DIR=/app/data/cache
      - ASTRAX_EXPORT_DIR=/app/data/exports
      - ASTRAX_DEBUG=false
    volumes:
      - astrax-data:/app/data
    restart: unless-stopped

volumes:
  astrax-data:
